name: RSTA-010 Capability Unlock

on:
  workflow_dispatch:
    inputs:
      event_id:
        description: Commitment event ID
        required: true
        type: string
      ledger_commit_sha:
        description: Durable commitment ledger commit
        required: true
        type: string
      source_run_id:
        description: Source commitment run ID
        required: true
        type: string
      expected_sha256:
        description: Commitment payload SHA-256
        required: true
        type: string
      branch:
        description: Branch containing the ledger commit
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  unlock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commitment commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ledger_commit_sha }}
          fetch-depth: 1

      - name: Verify valid commitment
        shell: bash
        env:
          EVENT_ID: ${{ inputs.event_id }}
          LEDGER_COMMIT_SHA: ${{ inputs.ledger_commit_sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, subprocess
          event=os.environ['EVENT_ID']; commit=os.environ['LEDGER_COMMIT_SHA']; source=os.environ['SOURCE_RUN_ID']; expected=os.environ['EXPECTED_SHA256']
          with open('ledger/rsta-008-consumed.json',encoding='utf-8') as f: ledger=json.load(f)
          entry=ledger.get(event)
          assert entry is not None, f'missing event: {event}'
          assert entry.get('state')=='CONSUMED', entry
          assert entry.get('source_run_id')==source, entry
          actual=hashlib.sha256(entry.get('payload','').encode()).hexdigest()
          assert actual==expected,(actual,expected)
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert head==commit,(head,commit)
          print(json.dumps({'event_id':event,'decision':'UNLOCK','reason':'VALID_DURABLE_COMMITMENT','ledger_commit_sha':commit,'source_run_id':source,'payload_sha256':actual},sort_keys=True))
          with open('/tmp/rsta-010-unlock.json','w',encoding='utf-8') as f:
              json.dump({'schema':'rncp-rsta-010-v2','event_id':event,'decision':'UNLOCK','reason':'VALID_DURABLE_COMMITMENT','ledger_commit_sha':commit,'source_run_id':source,'payload_sha256':actual,'downstream_capability':'RSTA-010-DEMO-ACTION'},f,indent=2,sort_keys=True)
          PY

      - name: Execute downstream action only after unlock
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "DOWNSTREAM_ACTION_EXECUTED_ONLY_AFTER_VALID_COMMITMENT" > /tmp/downstream-action.txt

      - name: Persist downstream unlock record
        id: persist_unlock
        uses: actions/github-script@v7
        env:
          EVENT_ID: ${{ inputs.event_id }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          LEDGER_COMMIT_SHA: ${{ inputs.ledger_commit_sha }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        with:
          github-token: ${{ github.token }}
          script: |
            const path='ledger/rsta-010-unlocks.json';
            const branch='${{ inputs.branch }}';
            const entry={state:'UNLOCKED',event_id:process.env.EVENT_ID,source_run_id:process.env.SOURCE_RUN_ID,ledger_commit_sha:process.env.LEDGER_COMMIT_SHA,payload_sha256:process.env.EXPECTED_SHA256,downstream_action:'RSTA-010-DEMO-ACTION'};
            let ledger={schema:'rncp-rsta-010-unlock-ledger-v1'}, sha;
            try { const current=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:branch}); sha=current.data.sha; ledger=JSON.parse(Buffer.from(current.data.content,'base64').toString('utf8')); } catch(e) { if(e.status!==404) throw e; }
            if(ledger[process.env.EVENT_ID]) core.setFailed('unlock already exists; replay refused');
            ledger[process.env.EVENT_ID]=entry;
            const res=await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path,message:`RSTA-010: persist downstream unlock ${process.env.EVENT_ID}`,content:Buffer.from(JSON.stringify(ledger,null,2)+'\n').toString('base64'),sha,branch});
            core.setOutput('unlock_commit_sha',res.data.commit.sha);
            console.log(JSON.stringify({event_id:process.env.EVENT_ID,unlock_commit_sha:res.data.commit.sha,state:'UNLOCKED'}));

      - name: Dispatch downstream replay guard
        uses: actions/github-script@v7
        env:
          EVENT_ID: ${{ inputs.event_id }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          UNLOCK_COMMIT_SHA: ${{ steps.persist_unlock.outputs.unlock_commit_sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.actions.createWorkflowDispatch({owner:context.repo.owner,repo:context.repo.repo,workflow_id:'rsta-011-downstream-replay-guard.yml',ref:'main',inputs:{event_id:process.env.EVENT_ID,unlock_commit_sha:process.env.UNLOCK_COMMIT_SHA,source_run_id:process.env.SOURCE_RUN_ID,branch:'main'}});
            console.log('workflow_dispatch accepted for RSTA-011 downstream replay guard');

      - name: Publish unlock evidence
        uses: actions/upload-artifact@v4
        with:
          name: rsta-010-capability-unlock
          path: |
            /tmp/rsta-010-unlock.json
            /tmp/downstream-action.txt
          if-no-files-found: error
