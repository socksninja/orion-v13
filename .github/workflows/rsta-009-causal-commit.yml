name: RSTA-009 Causal Commit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rsta-009-causal-commit.yml
      - ledger/rsta-008-consumed.json
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  RNCP_STAGE: RSTA-009

jobs:
  causal-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Persist fresh commitment state from this run
        id: persist
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const eventId = `RSTA-009-${context.runId}`;
            const payload = `RNCP-RSTA-009|run=${context.runId}|attempt=${process.env.GITHUB_RUN_ATTEMPT}|commit=${context.sha}`;
            const crypto = require('crypto');
            const payloadSha256 = crypto.createHash('sha256').update(payload).digest('hex');
            const path = 'ledger/rsta-008-consumed.json';
            const branch = context.ref.replace('refs/heads/','');
            const current = await github.rest.repos.getContent({owner:context.repo.owner, repo:context.repo.repo, path, ref:branch});
            const ledger = JSON.parse(Buffer.from(current.data.content,'base64').toString('utf8'));
            if (ledger[eventId]) core.setFailed(`event already exists: ${eventId}`);
            ledger[eventId]={state:'CONSUMED',payload,payload_sha256:payloadSha256,source:'GITHUB_ACTIONS_PUBLIC',first_verifier:'GITHUB_ACTIONS_PUBLIC',source_run_id:String(context.runId),source_commit_sha:context.sha};
            const updated = await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path,message:`RSTA-009: persist causal commitment from run ${context.runId}`,content:Buffer.from(JSON.stringify(ledger,null,2)+'\n').toString('base64'),sha:current.data.sha,branch});
            core.setOutput('event_id',eventId);
            core.setOutput('payload_sha256',payloadSha256);
            core.setOutput('ledger_commit_sha',updated.data.commit.sha);
            console.log(JSON.stringify({event_id:eventId,payload_sha256:payloadSha256,source_run_id:String(context.runId),ledger_commit_sha:updated.data.commit.sha},null,2));

      - name: Dispatch independent replay verifier
        uses: actions/github-script@v7
        env:
          EVENT_ID: ${{ steps.persist.outputs.event_id }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          LEDGER_COMMIT_SHA: ${{ steps.persist.outputs.ledger_commit_sha }}
          PAYLOAD_SHA256: ${{ steps.persist.outputs.payload_sha256 }}
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.actions.createWorkflowDispatch({owner:context.repo.owner,repo:context.repo.repo,workflow_id:'rsta-009-causal-replay.yml',ref:'main',inputs:{event_id:process.env.EVENT_ID,source_run_id:process.env.SOURCE_RUN_ID,ledger_commit_sha:process.env.LEDGER_COMMIT_SHA,token_id:'NONE',request_id:'NONE',expected_sha256:process.env.PAYLOAD_SHA256,branch:'main'}});
            console.log('workflow_dispatch accepted for RSTA-009 replay verifier');

      - name: Dispatch capability unlock verifier
        uses: actions/github-script@v7
        env:
          EVENT_ID: ${{ steps.persist.outputs.event_id }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          LEDGER_COMMIT_SHA: ${{ steps.persist.outputs.ledger_commit_sha }}
          PAYLOAD_SHA256: ${{ steps.persist.outputs.payload_sha256 }}
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.actions.createWorkflowDispatch({owner:context.repo.owner,repo:context.repo.repo,workflow_id:'rsta-010-capability-unlock.yml',ref:'main',inputs:{event_id:process.env.EVENT_ID,source_run_id:process.env.SOURCE_RUN_ID,ledger_commit_sha:process.env.LEDGER_COMMIT_SHA,expected_sha256:process.env.PAYLOAD_SHA256,branch:'main'}});
            console.log('workflow_dispatch accepted for RSTA-010 capability unlock');
